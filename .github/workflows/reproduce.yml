name: Reproduce research release
on: [push, pull_request, workflow_dispatch]
jobs:
  philosophy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify.py
      - run: python -m pip install -r requirements.txt
      - run: python scripts/graphs.py
      - run: python scripts/editorial_analysis.py
      - run: python scripts/graphs_v3.py
      - run: python scripts/profiles.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/humanities_growth.py --data data/humanities-growth/2026-10-26 --output analysis/humanities-growth/2026-10-26
      - run: python scripts/humanities_graphs.py --data data/humanities-growth/2026-10-26 --output figures/humanities-growth/2026-10-26
